name: Desktop installation and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fresh installation through the Windows setup script
        shell: pwsh
        run: ./start_local.ps1 -Setup
      - name: Python regression tests (synthetic data, mocked models)
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
      - name: Audio and coding Python tests (no model downloads)
        shell: pwsh
        run: |
          $env:PYTHONPATH='src;src/preparation;tests'
          ./.venv/Scripts/python.exe -m unittest discover -s tests/preparation -p 'test_*.py'
      - name: Audio and coding JavaScript tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests/preparation -Filter 'test_*.js' | Sort-Object Name | ForEach-Object FullName)
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: JavaScript regression tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -LiteralPath tests -Filter 'test_*.cjs' | Sort-Object Name | ForEach-Object FullName)
          if ($testFiles.Count -eq 0) { throw 'No JavaScript tests found.' }
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the installed local web server
        run: ./.venv/Scripts/python.exe tests/smoke_windows.py
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check launch scripts
        run: for script in start/macos/*.command start/macos/launcher.sh; do bash -n "$script"; done
      - name: Fresh installation through the user launcher
        run: bash start/macos/Einrichtung.command
      - name: Check owned process pause, resume and cleanup first
        run: PYTHONPATH=src:tests .venv-macos/bin/python3 -m unittest test_app_lifecycle.LifecycleProcessTests -v
      - name: Python regression tests (synthetic data, mocked models)
        run: .venv-macos/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audio and coding Python tests (no model downloads)
        run: PYTHONPATH=src:src/preparation:tests .venv-macos/bin/python3 -m unittest discover -s tests/preparation -p 'test_*.py'
      - name: Audio and coding JavaScript tests
        run: node --test tests/preparation/test_*.js
      - name: JavaScript regression tests
        run: node --test tests/test_*.cjs
      - name: Start the user launcher and check the local web server
        run: .venv-macos/bin/python3 tests/smoke_macos.py
